name: Build ChordHarp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurer
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build
          fi

      - name: Compiler
        run: cmake --build build --config Release --parallel 4

      - name: Préparer le zip
        shell: bash
        run: |
          ART=build/ChordHarp_artefacts/Release
          mkdir -p dist
          cp -R "$ART/VST3/ChordHarp.vst3" dist/
          cp INSTALLATION.txt dist/
          if [ "$RUNNER_OS" == "macOS" ]; then
            cp -R "$ART/AU/ChordHarp.component" dist/
            cp -R "$ART/Standalone/ChordHarp.app" dist/
            # signature ad-hoc pour que macOS accepte de charger le plugin
            codesign --force --deep -s - dist/ChordHarp.vst3 dist/ChordHarp.component dist/ChordHarp.app
            cd dist && zip -r -y ../ChordHarp-macOS.zip . && cd ..
          else
            cp "$ART/Standalone/ChordHarp.exe" dist/
            cd dist && 7z a ../ChordHarp-Windows.zip . && cd ..
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ChordHarp-${{ matrix.name }}
          path: ChordHarp-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publier dans "Releases"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ChordHarp v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Télécharge le zip de ton système (macOS ou Windows), puis suis INSTALLATION.txt.
          files: dist/*.zip
